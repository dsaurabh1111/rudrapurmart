[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Order create endpoint
[[redirects]]
  from = "/api/orders-create"
  to = "/.netlify/functions/admin-orders"
  status = 200
  force = true

# Other API endpoints - direct mapping
[[redirects]]
  from = "/api/orders-get/:orderNumber"
  to = "/.netlify/functions/orders-get"
  status = 200
  force = true

[[redirects]]
  from = "/api/orders-phone"
  to = "/.netlify/functions/orders-phone"
  status = 200
  force = true

[[redirects]]
  from = "/api/orders-status"
  to = "/.netlify/functions/orders-status"
  status = 200
  force = true

[[redirects]]
  from = "/api/products-sync"
  to = "/.netlify/functions/products-sync"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200